<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Bubbly</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#fff;color:#14141c;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
main{max-width:520px}
.code{font-size:15px;font-weight:700;color:#4B53D9;letter-spacing:.02em}
h1,h2{margin:10px 0 0;font-size:30px;line-height:1.25;letter-spacing:-.03em}
p{margin:12px 0 0;line-height:1.6;color:#5b5b6b}
.en{margin-top:28px;padding-top:24px;border-top:1px solid #ebebf1}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;background:#F2F2F7;color:#1d1d24;font-weight:700;font-size:15px;text-decoration:none}
a:hover{background:#E6E6EE}
a:focus-visible{outline:3px solid #5B67FF;outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>찾는 페이지가 없어요.</h1>
  <p>주소가 바뀌었거나 없어진 페이지예요. 첫 화면에서 다시 찾아보세요.</p>
  <div class="en" lang="en">
    <h2>We can't find that page.</h2>
    <p>The address may have changed, or the page is gone. Start again from the home page.</p>
  </div>
  <div class="links">
    <a href="/ko/" hreflang="ko">한국어 첫 화면</a>
    <a href="/en/" hreflang="en" lang="en">English home</a>
  </div>
</main>
</body>
</html>
